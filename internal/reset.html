<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#000000" />
  <title>YourOrg — Set a new password</title>

  <link rel="stylesheet" href="/internal/styles/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>YourOrg</h1>
      <p class="kicker">Set a new password</p>

      <form id="reset-form" autocomplete="off">
        <div class="field">
          <label for="next">New password</label>
          <input id="next" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="login-submit" id="submit">Save new password</button>
        <p class="login-error" id="error" role="alert"></p>
      </form>
    </div>
  </div>

  <script src="/internal/scripts/reset.js"></script>
</body>
</html>
